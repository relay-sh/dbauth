name: java

on:
  push:
    branches: [main]
    paths: ["java/**", "testvectors/**", ".github/workflows/java.yml"]
  pull_request:
    paths: ["java/**", "testvectors/**", ".github/workflows/java.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
