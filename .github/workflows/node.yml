name: node

on:
  push:
    branches: [main]
    paths: ["node/**", "testvectors/**", ".github/workflows/node.yml"]
  pull_request:
    paths: ["node/**", "testvectors/**", ".github/workflows/node.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Mint a token on the oldest supported Node
        run: |
          node --input-type=module -e "
          import { newToken } from './dist/index.js';
          const t = await newToken({ host: 'a.b.example.com', credentials: { accessKeyId: 'AKIDSMOKE', secretAccessKey: 's' } });
          if (!t.startsWith('sts.amazonaws.com/?')) process.exit(1);
          "
