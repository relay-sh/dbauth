name: python

on:
  push:
    branches: [main]
    paths: ["python/**", "testvectors/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "testvectors/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . botocore pytest pytest-cov ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
