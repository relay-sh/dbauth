[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay-dbauth"
version = "0.1.0"
description = "Mint IAM tokens that log in to Relay databases."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/relay-sh/dbauth"

[dependency-groups]
dev = ["botocore", "pytest", "pytest-cov", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/relay_dbauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=relay_dbauth --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true
